name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Validate (version, build, unit, component, publish, e2e)
        shell: pwsh
        run: ./scripts/validate.ps1 -VersionSuffix "ci.${{ github.run_number }}" -InstallBrowserDeps

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: activity-tracker-ci-${{ github.run_number }}
          path: artifacts/publish/wwwroot
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      # Debug-signed: proves the app builds. Release-signed APKs only come from the Release workflow.
      - name: Build the APK
        shell: pwsh
        run: ./scripts/build-android.ps1 -InstallDependencies -VersionSuffix "ci.${{ github.run_number }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: activity-tracker-android-ci-${{ github.run_number }}
          path: artifacts/android/*.apk
          retention-days: 14
