name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Validate (version, build, unit, component, publish, e2e)
        shell: pwsh
        run: ./scripts/validate.ps1 -VersionSuffix "ci.${{ github.run_number }}" -InstallBrowserDeps

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: activity-tracker-ci-${{ github.run_number }}
          path: artifacts/publish/wwwroot
          retention-days: 14

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry for code changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^src/'; then
            git diff --name-only "$base" HEAD | grep -qx 'CHANGELOG.md' \
              || { echo "::error::src/ changed but CHANGELOG.md was not updated (add the 'skip-changelog' label to bypass)."; exit 1; }
          fi
          echo "OK"
