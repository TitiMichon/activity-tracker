name: Release

# Triggered by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Validate & release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Validate version ${{ github.ref_name }}
        shell: pwsh
        run: ./scripts/validate.ps1 -ExpectedVersion "${{ github.ref_name }}" -InstallBrowserDeps

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          if ($text -notmatch "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)") { throw "No changelog section for $version" }
          Set-Content -Path artifacts/RELEASE_NOTES.md -Value $Matches[1].Trim()

      - name: Package
        run: |
          cd artifacts/publish/wwwroot
          zip -qr "../../activity-tracker-${{ github.ref_name }}.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "artifacts/activity-tracker-${{ github.ref_name }}.zip" \
            --title "Activity Tracker ${{ github.ref_name }}" \
            --notes-file artifacts/RELEASE_NOTES.md \
            $([[ "${{ github.ref_name }}" == *-* ]] && echo "--prerelease")

      - name: Prepare GitHub Pages site
        shell: pwsh
        run: ./scripts/prepare-pages.ps1 -Path artifacts/publish/wwwroot -BasePath "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
